<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    Aqua glass frame for Icon Composer (macOS Tahoe). The outer edge matches
    the composer's mask: full 1024 canvas, corner radius 264 with light
    corner smoothing (0.16). Inner edge is concentric, 90px in, radius 174.
    Outer path bleeds 4px past the canvas so the mask clips it cleanly.
  -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#9dbfe6"/>
      <stop offset="0.12" stop-color="#7ea9dc"/>
      <stop offset="0.5"  stop-color="#5f93d3"/>
      <stop offset="0.85" stop-color="#7fbde8"/>
      <stop offset="1"    stop-color="#a9dcf6"/>
    </linearGradient>
    <radialGradient id="pool" cx="0.5" cy="1.0" r="0.6">
      <stop offset="0"   stop-color="#d6f6ff" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#b4e8fb" stop-opacity="0.5"/>
      <stop offset="1"   stop-color="#8fc9f0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.7" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1"   stop-color="#ffffff" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="sideGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1"   stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="softer" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <clipPath id="ring" clip-rule="evenodd">
      <path d="M 717.12 -4.00 C 756.95 -4.00, 776.86 -4.00, 793.59 -1.89 A 268.00 268.00 0 0 1 1025.89 230.41 C 1028.00 247.14, 1028.00 267.05, 1028.00 306.88 L 1028.00 717.12 C 1028.00 756.95, 1028.00 776.86, 1025.89 793.59 A 268.00 268.00 0 0 1 793.59 1025.89 C 776.86 1028.00, 756.95 1028.00, 717.12 1028.00 L 306.88 1028.00 C 267.05 1028.00, 247.14 1028.00, 230.41 1025.89 A 268.00 268.00 0 0 1 -1.89 793.59 C -4.00 776.86, -4.00 756.95, -4.00 717.12 L -4.00 306.88 C -4.00 267.05, -4.00 247.14, -1.89 230.41 A 268.00 268.00 0 0 1 230.41 -1.89 C 247.14 -4.00, 267.05 -4.00, 306.88 -4.00 Z M 732.16 90.00 C 758.02 90.00, 770.95 90.00, 781.81 91.37 A 174.00 174.00 0 0 1 932.63 242.19 C 934.00 253.05, 934.00 265.98, 934.00 291.84 L 934.00 732.16 C 934.00 758.02, 934.00 770.95, 932.63 781.81 A 174.00 174.00 0 0 1 781.81 932.63 C 770.95 934.00, 758.02 934.00, 732.16 934.00 L 291.84 934.00 C 265.98 934.00, 253.05 934.00, 242.19 932.63 A 174.00 174.00 0 0 1 91.37 781.81 C 90.00 770.95, 90.00 758.02, 90.00 732.16 L 90.00 291.84 C 90.00 265.98, 90.00 253.05, 91.37 242.19 A 174.00 174.00 0 0 1 242.19 91.37 C 253.05 90.00, 265.98 90.00, 291.84 90.00 Z" clip-rule="evenodd"/>
    </clipPath>
  </defs>

  <path d="M 717.12 -4.00 C 756.95 -4.00, 776.86 -4.00, 793.59 -1.89 A 268.00 268.00 0 0 1 1025.89 230.41 C 1028.00 247.14, 1028.00 267.05, 1028.00 306.88 L 1028.00 717.12 C 1028.00 756.95, 1028.00 776.86, 1025.89 793.59 A 268.00 268.00 0 0 1 793.59 1025.89 C 776.86 1028.00, 756.95 1028.00, 717.12 1028.00 L 306.88 1028.00 C 267.05 1028.00, 247.14 1028.00, 230.41 1025.89 A 268.00 268.00 0 0 1 -1.89 793.59 C -4.00 776.86, -4.00 756.95, -4.00 717.12 L -4.00 306.88 C -4.00 267.05, -4.00 247.14, -1.89 230.41 A 268.00 268.00 0 0 1 230.41 -1.89 C 247.14 -4.00, 267.05 -4.00, 306.88 -4.00 Z M 732.16 90.00 C 758.02 90.00, 770.95 90.00, 781.81 91.37 A 174.00 174.00 0 0 1 932.63 242.19 C 934.00 253.05, 934.00 265.98, 934.00 291.84 L 934.00 732.16 C 934.00 758.02, 934.00 770.95, 932.63 781.81 A 174.00 174.00 0 0 1 781.81 932.63 C 770.95 934.00, 758.02 934.00, 732.16 934.00 L 291.84 934.00 C 265.98 934.00, 253.05 934.00, 242.19 932.63 A 174.00 174.00 0 0 1 91.37 781.81 C 90.00 770.95, 90.00 758.02, 90.00 732.16 L 90.00 291.84 C 90.00 265.98, 90.00 253.05, 91.37 242.19 A 174.00 174.00 0 0 1 242.19 91.37 C 253.05 90.00, 265.98 90.00, 291.84 90.00 Z" fill-rule="evenodd" fill="url(#body)"/>
  <g clip-path="url(#ring)">
    <!-- light pooling along the bottom -->
    <rect x="0" y="0" width="1024" height="1024" fill="url(#pool)"/>
    <!-- refraction darkening along the outer edge -->
    <path d="M 717.12 -4.00 C 756.95 -4.00, 776.86 -4.00, 793.59 -1.89 A 268.00 268.00 0 0 1 1025.89 230.41 C 1028.00 247.14, 1028.00 267.05, 1028.00 306.88 L 1028.00 717.12 C 1028.00 756.95, 1028.00 776.86, 1025.89 793.59 A 268.00 268.00 0 0 1 793.59 1025.89 C 776.86 1028.00, 756.95 1028.00, 717.12 1028.00 L 306.88 1028.00 C 267.05 1028.00, 247.14 1028.00, 230.41 1025.89 A 268.00 268.00 0 0 1 -1.89 793.59 C -4.00 776.86, -4.00 756.95, -4.00 717.12 L -4.00 306.88 C -4.00 267.05, -4.00 247.14, -1.89 230.41 A 268.00 268.00 0 0 1 230.41 -1.89 C 247.14 -4.00, 267.05 -4.00, 306.88 -4.00 Z" fill="none" stroke="#1c4f9e" stroke-opacity="0.75" stroke-width="56" filter="url(#soft)"/>
    <!-- darker seam along the inner edge -->
    <path d="M 732.16 90.00 C 758.02 90.00, 770.95 90.00, 781.81 91.37 A 174.00 174.00 0 0 1 932.63 242.19 C 934.00 253.05, 934.00 265.98, 934.00 291.84 L 934.00 732.16 C 934.00 758.02, 934.00 770.95, 932.63 781.81 A 174.00 174.00 0 0 1 781.81 932.63 C 770.95 934.00, 758.02 934.00, 732.16 934.00 L 291.84 934.00 C 265.98 934.00, 253.05 934.00, 242.19 932.63 A 174.00 174.00 0 0 1 91.37 781.81 C 90.00 770.95, 90.00 758.02, 90.00 732.16 L 90.00 291.84 C 90.00 265.98, 90.00 253.05, 91.37 242.19 A 174.00 174.00 0 0 1 242.19 91.37 C 253.05 90.00, 265.98 90.00, 291.84 90.00 Z" fill="none" stroke="#1c4f9e" stroke-opacity="0.45" stroke-width="20" filter="url(#soft)"/>
    <!-- inset highlight along the top bar -->
    <rect x="316" y="16" width="392" height="36" rx="18" ry="18" fill="url(#gloss)" filter="url(#softer)"/>
    <!-- faint highlights down the sides -->
    <rect x="16" y="316" width="22" height="392" rx="11" ry="11" fill="url(#sideGloss)" filter="url(#softer)"/>
    <rect x="986" y="316" width="22" height="392" rx="11" ry="11" fill="url(#sideGloss)" filter="url(#softer)"/>
  </g>
  <path d="M 732.16 90.00 C 758.02 90.00, 770.95 90.00, 781.81 91.37 A 174.00 174.00 0 0 1 932.63 242.19 C 934.00 253.05, 934.00 265.98, 934.00 291.84 L 934.00 732.16 C 934.00 758.02, 934.00 770.95, 932.63 781.81 A 174.00 174.00 0 0 1 781.81 932.63 C 770.95 934.00, 758.02 934.00, 732.16 934.00 L 291.84 934.00 C 265.98 934.00, 253.05 934.00, 242.19 932.63 A 174.00 174.00 0 0 1 91.37 781.81 C 90.00 770.95, 90.00 758.02, 90.00 732.16 L 90.00 291.84 C 90.00 265.98, 90.00 253.05, 91.37 242.19 A 174.00 174.00 0 0 1 242.19 91.37 C 253.05 90.00, 265.98 90.00, 291.84 90.00 Z" fill="none" stroke="#2c5ea9" stroke-opacity="0.45" stroke-width="2"/>
</svg>
