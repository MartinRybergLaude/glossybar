<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    Sized for a 1024x1024 macOS icon canvas. The icon squircle spans roughly
    100..924 on both axes; this pill sits inside it with ~50px of padding.
    Pill bounds: x 150..874 (724 wide), y 140..330 (190 tall), radius 95.
  -->
  <defs>
    <!-- Translucent glass body: steel blue on top, darker band under the
         highlight, brightening toward the bottom -->
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#9dbfe6"/>
      <stop offset="0.38" stop-color="#7ea9dc"/>
      <stop offset="0.55" stop-color="#5f93d3"/>
      <stop offset="0.78" stop-color="#7fbde8"/>
      <stop offset="1"    stop-color="#a9dcf6"/>
    </linearGradient>
    <!-- Cyan light pooling at the bottom of the glass -->
    <radialGradient id="pool" cx="0.5" cy="1.05" r="0.75" fx="0.5" fy="1.05">
      <stop offset="0"   stop-color="#d6f6ff" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#b4e8fb" stop-opacity="0.6"/>
      <stop offset="1"   stop-color="#8fc9f0" stop-opacity="0"/>
    </radialGradient>
    <!-- Dark refraction at the rounded ends -->
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#1c4f9e" stop-opacity="0.95"/>
      <stop offset="0.14" stop-color="#1c4f9e" stop-opacity="0.35"/>
      <stop offset="0.3"  stop-color="#1c4f9e" stop-opacity="0"/>
      <stop offset="0.7"  stop-color="#1c4f9e" stop-opacity="0"/>
      <stop offset="0.86" stop-color="#1c4f9e" stop-opacity="0.35"/>
      <stop offset="1"    stop-color="#1c4f9e" stop-opacity="0.95"/>
    </linearGradient>
    <!-- Thin darkening along the top edge -->
    <linearGradient id="topRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#2d5fae" stop-opacity="0.7"/>
      <stop offset="0.25" stop-color="#2d5fae" stop-opacity="0"/>
      <stop offset="1"    stop-color="#2d5fae" stop-opacity="0"/>
    </linearGradient>
    <!-- Inset specular highlight -->
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.7"  stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1"    stop-color="#ffffff" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-40%" width="130%" height="240%">
      <feDropShadow dx="0" dy="28" stdDeviation="22" flood-color="#4a8ad0" flood-opacity="0.55"/>
    </filter>
    <filter id="soft" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="softer" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <clipPath id="pillClip">
      <rect x="150" y="140" width="724" height="190" rx="95" ry="95"/>
    </clipPath>
  </defs>

  <!-- Pill body with blue-tinted shadow -->
  <g filter="url(#shadow)">
    <rect x="150" y="140" width="724" height="190" rx="95" ry="95" fill="url(#body)"/>
  </g>
  <g clip-path="url(#pillClip)">
    <!-- light pooling at the bottom -->
    <rect x="150" y="140" width="724" height="190" fill="url(#pool)"/>
    <!-- refraction at the ends -->
    <rect x="150" y="140" width="724" height="190" rx="95" ry="95"
          fill="none" stroke="url(#rim)" stroke-width="90" filter="url(#soft)"/>
    <!-- top edge darkening -->
    <rect x="150" y="140" width="724" height="190" rx="95" ry="95"
          fill="none" stroke="url(#topRim)" stroke-width="24" filter="url(#soft)"/>
    <!-- inset pill-shaped highlight -->
    <rect x="208" y="150" width="608" height="64" rx="32" ry="32" fill="url(#gloss)" filter="url(#softer)"/>
  </g>
  <rect x="150" y="140" width="724" height="190" rx="95" ry="95" fill="none" stroke="#2c5ea9" stroke-opacity="0.55" stroke-width="2"/>
</svg>
